name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: ./spotify-tray-wayland

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Install nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@latest

      - name: Run nilaway
        run: nilaway ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Run tests with race detection
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./spotify-tray-wayland/coverage.out

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          bash -n setup.sh
          bash -n uninstall.sh

      - name: Validate PKGBUILD syntax
        run: |
          bash -n aur/spotify-tray-wayland-bin/PKGBUILD
          bash -n aur/spotify-tray-wayland-git/PKGBUILD

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test, shell-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Build
        run: go build -v -o spotify-tray-wayland .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: spotify-tray-wayland-linux-amd64
          path: ./spotify-tray-wayland/spotify-tray-wayland
