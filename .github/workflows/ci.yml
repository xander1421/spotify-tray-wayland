name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: ./spotify-tray-wayland

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # We'll handle caching ourselves

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-staticcheck-nilaway-v1
          restore-keys: |
            go-tools-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: |
          if [ ! -f ~/go/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@latest
          fi

      - name: Run staticcheck
        run: ~/go/bin/staticcheck ./...

      - name: Install nilaway
        run: |
          if [ ! -f ~/go/bin/nilaway ]; then
            go install go.uber.org/nilaway/cmd/nilaway@latest
          fi

      - name: Run nilaway
        run: ~/go/bin/nilaway ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache govulncheck
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: go-tools-${{ runner.os }}-govulncheck-v1

      - name: Download dependencies
        run: go mod download

      - name: Install govulncheck
        run: |
          if [ ! -f ~/go/bin/govulncheck ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi

      - name: Run govulncheck
        run: ~/go/bin/govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detection
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./spotify-tray-wayland/coverage.out

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          bash -n setup.sh
          bash -n uninstall.sh

      - name: Validate PKGBUILD syntax
        run: |
          bash -n aur/spotify-tray-wayland-bin/PKGBUILD
          bash -n aur/spotify-tray-wayland-git/PKGBUILD

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test, shell-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o spotify-tray-wayland .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: spotify-tray-wayland-linux-amd64
          path: ./spotify-tray-wayland/spotify-tray-wayland
