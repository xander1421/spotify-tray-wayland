name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: ./spotify-tray-wayland

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Run tests with race detection
        run: go test -race ./...

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          bash -n setup.sh
          bash -n uninstall.sh

      - name: Validate PKGBUILD syntax
        run: |
          bash -n aur/spotify-tray-wayland-bin/PKGBUILD
          bash -n aur/spotify-tray-wayland-git/PKGBUILD

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, security, test, shell-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: spotify-tray-wayland/go.sum

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build linux/amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o ../dist/spotify-tray-wayland-linux-amd64 .

      - name: Build linux/arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -ldflags="-s -w" -o ../dist/spotify-tray-wayland-linux-arm64 .

      - name: Create checksums
        working-directory: ./dist
        run: sha256sum spotify-tray-wayland-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/spotify-tray-wayland-linux-amd64
            dist/spotify-tray-wayland-linux-arm64
            dist/checksums.txt
            setup.sh
            uninstall.sh

      - name: Update AUR PKGBUILD checksums
        working-directory: .
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          AMD64_SHA=$(sha256sum dist/spotify-tray-wayland-linux-amd64 | cut -d' ' -f1)
          ARM64_SHA=$(sha256sum dist/spotify-tray-wayland-linux-arm64 | cut -d' ' -f1)

          # Update version and checksums in PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/spotify-tray-wayland-bin/PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$AMD64_SHA')/" aur/spotify-tray-wayland-bin/PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$ARM64_SHA')/" aur/spotify-tray-wayland-bin/PKGBUILD

          # Generate .SRCINFO manually (no makepkg in CI)
          cat > aur/spotify-tray-wayland-bin/.SRCINFO << EOF
          pkgbase = spotify-tray-wayland-bin
          	pkgdesc = Native Wayland/Hyprland system tray for Spotify with scroll and middle-click controls
          	pkgver = $VERSION
          	pkgrel = 1
          	url = https://github.com/xander1421/spotify-tray-wayland
          	install = spotify-tray-wayland-bin.install
          	arch = x86_64
          	arch = aarch64
          	license = GPL3
          	depends = dbus
          	optdepends = spotify-launcher: official Spotify launcher
          	optdepends = spotify: Spotify client (AUR)
          	optdepends = hyprland: for window show/hide functionality
          	provides = spotify-tray-wayland
          	conflicts = spotify-tray-wayland
          	conflicts = spotify-tray-wayland-git
          	options = !debug
          	source_x86_64 = spotify-tray-wayland-bin-$VERSION-x86_64::https://github.com/xander1421/spotify-tray-wayland/releases/download/v$VERSION/spotify-tray-wayland-linux-amd64
          	sha256sums_x86_64 = $AMD64_SHA
          	source_aarch64 = spotify-tray-wayland-bin-$VERSION-aarch64::https://github.com/xander1421/spotify-tray-wayland/releases/download/v$VERSION/spotify-tray-wayland-linux-arm64
          	sha256sums_aarch64 = $ARM64_SHA

          pkgname = spotify-tray-wayland-bin
          EOF

      - name: Commit and push PKGBUILD updates
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aur/spotify-tray-wayland-bin/PKGBUILD aur/spotify-tray-wayland-bin/.SRCINFO
          git commit -m "Update AUR checksums for ${GITHUB_REF#refs/tags/}" || exit 0
          git push origin HEAD:main

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          # Clone AUR repo and update
          git clone ssh://aur@aur.archlinux.org/spotify-tray-wayland-bin.git aur-repo
          cp aur/spotify-tray-wayland-bin/PKGBUILD aur-repo/
          cp aur/spotify-tray-wayland-bin/.SRCINFO aur-repo/
          cp aur/spotify-tray-wayland-bin/*.install aur-repo/ 2>/dev/null || true

          cd aur-repo
          git config user.name "xander1421"
          git config user.email "alexpruteanu@hotmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update to ${GITHUB_REF#refs/tags/}"
          git push
