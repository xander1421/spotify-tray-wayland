name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: ./spotify-tray-wayland

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-staticcheck-v1

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: |
          if [ ! -f ~/go/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@latest
          fi

      - name: Run staticcheck
        run: ~/go/bin/staticcheck ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache govulncheck
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: go-tools-${{ runner.os }}-govulncheck-v1

      - name: Download dependencies
        run: go mod download

      - name: Install govulncheck
        run: |
          if [ ! -f ~/go/bin/govulncheck ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi

      - name: Run govulncheck
        run: ~/go/bin/govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detection
        run: go test -race ./...

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          bash -n setup.sh
          bash -n uninstall.sh

      - name: Validate PKGBUILD syntax
        run: |
          bash -n aur/spotify-tray-wayland-bin/PKGBUILD
          bash -n aur/spotify-tray-wayland-git/PKGBUILD

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, security, test, shell-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('spotify-tray-wayland/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build linux/amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o ../dist/spotify-tray-wayland-linux-amd64 .

      - name: Build linux/arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -ldflags="-s -w" -o ../dist/spotify-tray-wayland-linux-arm64 .

      - name: Create checksums
        working-directory: ./dist
        run: sha256sum spotify-tray-wayland-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/spotify-tray-wayland-linux-amd64
            dist/spotify-tray-wayland-linux-arm64
            dist/checksums.txt
            setup.sh
            uninstall.sh

      - name: Update AUR PKGBUILDs
        working-directory: .
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          AMD64_SHA=$(sha256sum dist/spotify-tray-wayland-linux-amd64 | cut -d' ' -f1)
          ARM64_SHA=$(sha256sum dist/spotify-tray-wayland-linux-arm64 | cut -d' ' -f1)
          GIT_REV=$(git rev-list --count HEAD)
          GIT_SHA=$(git rev-parse --short HEAD)

          # === Update -bin package ===
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/spotify-tray-wayland-bin/PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$AMD64_SHA')/" aur/spotify-tray-wayland-bin/PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$ARM64_SHA')/" aur/spotify-tray-wayland-bin/PKGBUILD

          cat > aur/spotify-tray-wayland-bin/.SRCINFO << EOF
          pkgbase = spotify-tray-wayland-bin
          	pkgdesc = Native Wayland/Hyprland system tray for Spotify with scroll and middle-click controls
          	pkgver = $VERSION
          	pkgrel = 1
          	url = https://github.com/xander1421/spotify-tray-wayland
          	install = spotify-tray-wayland-bin.install
          	arch = x86_64
          	arch = aarch64
          	license = GPL3
          	depends = dbus
          	optdepends = spotify-launcher: official Spotify launcher
          	optdepends = spotify: Spotify client (AUR)
          	optdepends = hyprland: for window show/hide functionality
          	provides = spotify-tray-wayland
          	conflicts = spotify-tray-wayland
          	conflicts = spotify-tray-wayland-git
          	options = !debug
          	source_x86_64 = spotify-tray-wayland-bin-$VERSION-x86_64::https://github.com/xander1421/spotify-tray-wayland/releases/download/v$VERSION/spotify-tray-wayland-linux-amd64
          	sha256sums_x86_64 = $AMD64_SHA
          	source_aarch64 = spotify-tray-wayland-bin-$VERSION-aarch64::https://github.com/xander1421/spotify-tray-wayland/releases/download/v$VERSION/spotify-tray-wayland-linux-arm64
          	sha256sums_aarch64 = $ARM64_SHA

          pkgname = spotify-tray-wayland-bin
          EOF

          # === Update -git package ===
          sed -i "s/^pkgver=.*/pkgver=r${GIT_REV}.${GIT_SHA}/" aur/spotify-tray-wayland-git/PKGBUILD

          cat > aur/spotify-tray-wayland-git/.SRCINFO << EOF
          pkgbase = spotify-tray-wayland-git
          	pkgdesc = Native Wayland/Hyprland system tray for Spotify with scroll and middle-click controls
          	pkgver = r${GIT_REV}.${GIT_SHA}
          	pkgrel = 1
          	url = https://github.com/xander1421/spotify-tray-wayland
          	install = spotify-tray-wayland-git.install
          	arch = x86_64
          	arch = aarch64
          	license = GPL3
          	makedepends = go
          	makedepends = git
          	depends = dbus
          	optdepends = spotify-launcher: official Spotify launcher
          	optdepends = spotify: Spotify client (AUR)
          	optdepends = hyprland: for window show/hide functionality
          	provides = spotify-tray-wayland
          	conflicts = spotify-tray-wayland
          	conflicts = spotify-tray-wayland-bin
          	options = !debug
          	source = spotify-tray-wayland-git::git+https://github.com/xander1421/spotify-tray-wayland.git
          	sha256sums = SKIP

          pkgname = spotify-tray-wayland-git
          EOF

      - name: Commit and push PKGBUILD updates
        working-directory: .
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          git add aur/spotify-tray-wayland-bin/PKGBUILD aur/spotify-tray-wayland-bin/.SRCINFO
          git add aur/spotify-tray-wayland-git/PKGBUILD aur/spotify-tray-wayland-git/.SRCINFO
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update AUR checksums for ${GITHUB_REF#refs/tags/}"
          git push origin main

      - name: Publish to AUR
        working-directory: .
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          # === Publish -bin package ===
          git clone ssh://aur@aur.archlinux.org/spotify-tray-wayland-bin.git aur-bin
          cp aur/spotify-tray-wayland-bin/PKGBUILD aur-bin/
          cp aur/spotify-tray-wayland-bin/.SRCINFO aur-bin/
          cp aur/spotify-tray-wayland-bin/*.install aur-bin/ 2>/dev/null || true
          cd aur-bin
          git config user.name "xander1421"
          git config user.email "alexpruteanu@hotmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update to ${GITHUB_REF#refs/tags/}"
          git push
          cd ..

          # === Publish -git package ===
          git clone ssh://aur@aur.archlinux.org/spotify-tray-wayland-git.git aur-git
          cp aur/spotify-tray-wayland-git/PKGBUILD aur-git/
          cp aur/spotify-tray-wayland-git/.SRCINFO aur-git/
          cp aur/spotify-tray-wayland-git/*.install aur-git/ 2>/dev/null || true
          cd aur-git
          git config user.name "xander1421"
          git config user.email "alexpruteanu@hotmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update to ${GITHUB_REF#refs/tags/}"
          git push
